project:
  type: website
  output-dir: _site

lang: es
date-format: "YYYY-MM-DD"

# Adds the "read in the other language" link and the AI-translation note
# to any post that declares a `translation:` path in its front matter.
filters:
  - translation-link.lua

website:
  title: "Tomlog"
  description: "Reflexiones, proyectos y temas que me interesan."
  site-url: https://tomasaam.github.io/tomlog
  favicon: images/avatar.svg
  search: false
  navbar:
    title: "tomlog"
    collapse: false
    right:
      - text: "es"
        href: index.qmd
      - text: "en"
        href: en/index.qmd
      - icon: github
        href: https://github.com/TomasAAM
        aria-label: GitHub
      - icon: rss
        href: index.xml
        aria-label: RSS

format:
  html:
    theme: [darkly, custom.scss]
    highlight-style: zenburn
    template-partials:
      - _partials/title-block.html
